{% extends 'base.html' %}

{% block nav %}
<a class="nav-link text-white active" href="/">Inicio</a>
<a class="nav-link text-white" href="{{ url_for('ver_empleos') }}">Empleos</a>
<a class="nav-link text-white" href="#">Ayuda</a>
{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card card-custom p-4">
            <h3 class="text-center font-weight-bold mb-1" style="color: var(--purple-main);">Iniciar sesión / Registro seguro</h3>
            <p class="text-center text-muted small mb-4">🔒 Tu información está encriptada y protegida</p>

            <form action="{{ url_for('login') }}" method="POST">
                <div class="mb-3">
                    <label class="form-label font-weight-bold">Correo electrónico o usuario</label>
                    <input type="email" name="correo" class="form-control" required placeholder="ejemplo@correo.com">
                </div>
                <div class="mb-3">
                    <label class="form-label font-weight-bold">Contraseña</label>
                    <input type="password" name="clave" class="form-control" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-valiente w-100 py-2 mt-2">INGRESAR AL PORTAL SEGURO</button>
            </form>

            <div class="text-center mt-4">
                <p class="mb-0">¿No tienes cuenta? <a href="{{ url_for('registro') }}" style="color: var(--purple-main); font-weight: bold;">Regístrate aquí.</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
